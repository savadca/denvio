<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- Chrome's auto-translate rewrites text under React and can blank the page -->
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Denvio</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦷</text></svg>" />
    <style>
      /* Boot screen: visible until React mounts, so the page is never just blank. */
      #boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; padding: 24px; text-align: center; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; color: #737373; }
      #boot .boot-logo { font-family: 'Grand Hotel', cursive; font-size: 48px; color: #d62976; }
      #boot-error { display: none; max-width: 420px; color: #b4232f; background: #ffe1e4; padding: 12px 14px;
        border-radius: 8px; font-size: 13px; text-align: left; word-break: break-word; }
      @media (prefers-color-scheme: dark) { body { background: #000; } #boot-error { background: #3d0a10; color: #ffb3bb; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="boot-logo">Denvio</div>
        <div id="boot-msg">Loading…</div>
        <div id="boot-error"></div>
        <noscript>Please turn on JavaScript to use Denvio.</noscript>
      </div>
    </div>
    <script>
      // Plain old JavaScript on purpose: this must run even in browsers that can't run the app.
      (function () {
        function show(msg) {
          var box = document.getElementById('boot-error');
          if (!box) return; // app already mounted
          box.style.display = 'block';
          box.textContent = (box.textContent ? box.textContent + '\n' : '') + msg;
          document.getElementById('boot-msg').textContent = 'Denvio could not start in this browser.';
        }
        window.addEventListener('error', function (e) {
          if (e.message) show('Error: ' + e.message + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
          else if (e.target && (e.target.src || e.target.href)) show('Could not load ' + (e.target.src || e.target.href));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          show('Error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
        });
        setTimeout(function () {
          if (document.getElementById('boot-msg') && !document.getElementById('boot-error').textContent) {
            document.getElementById('boot-msg').textContent =
              'Still loading… If this never finishes, update your browser (Chrome or Safari) or open the production link on port 4000.';
          }
        }, 15000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
